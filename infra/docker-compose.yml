# Môi trường phát triển cục bộ: PostgreSQL 16 + PostGIS, Redis.
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: sqt
      POSTGRES_PASSWORD: sqt
      POSTGRES_DB: sqt
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data, ./init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sqt"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
volumes:
  pgdata:
