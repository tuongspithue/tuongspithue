name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sqt
          POSTGRES_PASSWORD: sqt
          POSTGRES_DB: sqt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sqt:sqt@localhost:5432/sqt_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Phân tích mã & test
        run: |
          for d in packages/sqt_core packages/sqt_partner apps/customer apps/merchant apps/rider; do
            (cd "$d" && flutter analyze && flutter test) || exit 1
          done
      # Khách dùng web app (không cần cài).
      - name: Build web app khách
        working-directory: mobile/apps/customer
        run: flutter build web --release --no-web-resources-cdn

  # Quán và shipper dùng app cài đặt để chuông kêu kịp thời kể cả khi khoá máy.
  android:
    runs-on: ubuntu-latest
    needs: mobile
    strategy:
      matrix:
        app: [merchant, rider]
    defaults:
      run:
        working-directory: mobile/apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - name: Build APK
        # API_URL lấy từ biến kho (Settings → Variables), chưa đặt thì dùng địa chỉ mẫu.
        run: flutter build apk --release --dart-define=API_URL=${{ vars.API_URL || 'https://api.vidu.vn' }}
      - uses: actions/upload-artifact@v4
        with:
          name: sqt-${{ matrix.app }}-apk
          path: mobile/apps/${{ matrix.app }}/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
