name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: sqt
          POSTGRES_PASSWORD: sqt
          POSTGRES_DB: sqt_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U sqt" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://sqt:sqt@localhost:5432/sqt_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm test

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.9
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Phân tích mã & test
        run: |
          for d in packages/sqt_core apps/customer apps/merchant apps/rider; do
            (cd "$d" && flutter analyze && flutter test) || exit 1
          done
      - name: Build web
        run: |
          for a in customer merchant rider; do
            (cd "apps/$a" && flutter build web --release --no-web-resources-cdn) || exit 1
          done
