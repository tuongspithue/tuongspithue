name: sqt_partner
description: Phần dùng chung cho app cài đặt của quán và shipper — dịch vụ chạy nền theo dõi đơn, chuông khi khoá máy, GPS nền, chụp ảnh, kiểm tra máy.
version: 0.1.0
publish_to: none
resolution: workspace
environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"
dependencies:
  flutter:
    sdk: flutter
  sqt_core:
    path: ../sqt_core
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^19.0.0
  geolocator: ^14.0.0
  image_picker: ^1.1.0
  permission_handler: ^12.0.0
  shared_preferences: ^2.3.0
  wakelock_plus: ^1.3.0
  http: ^1.2.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
