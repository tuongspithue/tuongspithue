services:
  dev:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    environment:
      DATABASE_URL: postgres://sqt:sqt@db:5432/sqt
    depends_on: [db]

  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: sqt
      POSTGRES_PASSWORD: sqt
      POSTGRES_DB: sqt
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
